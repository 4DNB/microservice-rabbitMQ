spring.application.name=order-service
server.port=${ORDER_PORT:8083}

spring.datasource.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5432/sales_order_db}
spring.datasource.username=${ORDER_DB_USERNAME:postgres}
spring.datasource.password=${ORDER_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

services.products.base-url=${PRODUCTS_SERVICE_URL:http://localhost:8082}
services.products.connect-timeout=${PRODUCTS_CONNECT_TIMEOUT:2s}
services.products.read-timeout=${PRODUCTS_READ_TIMEOUT:3s}
services.products.api-key=${INVENTORY_SERVICE_API_KEY:}
