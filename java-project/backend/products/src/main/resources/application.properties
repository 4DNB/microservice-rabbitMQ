spring.application.name=products
server.port=${PRODUCT_PORT:8082}

spring.datasource.url=${PRODUCT_DB_URL:jdbc:postgresql://localhost:5432/sales_product_db}
spring.datasource.username=${PRODUCT_DB_USERNAME:postgres}
spring.datasource.password=${PRODUCT_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Creates or updates the products table when the service starts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

inventory.service-api-key=${INVENTORY_SERVICE_API_KEY:}
